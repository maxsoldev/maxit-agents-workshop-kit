{% extends "base.html" %}
{% block title %}Docs{% endblock %}
{% block main %}
<div class="docs">
  <nav class="doc-list">
    {% for f in files %}<a href="/docs?name={{ f }}" class="{{ 'on' if f == doc }}">{{ f }}</a>{% endfor %}
  </nav>
  <article><div class="muted small">{{ doc }}</div><div class="doc">{{ html }}</div></article>
</div>
{% endblock %}
