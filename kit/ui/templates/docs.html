{% extends "base.html" %}
{% block title %}Docs{% endblock %}
{% block main %}
<div class="docs">
  <nav class="doc-list">
    {% for f, title in nav %}<a href="/docs?name={{ f }}" class="{{ 'on' if f == doc }}">{{ title }}</a>{% endfor %}
  </nav>
  <article>
    {% if path %}<div class="muted small">File: <a href="/docs/raw?name={{ doc }}"><code>{{ path }}</code></a></div>{% endif %}
    <div class="doc">{{ html }}</div>
  </article>
</div>
{% endblock %}
