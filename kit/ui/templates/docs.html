{% extends "base.html" %}
{% block title %}Guide{% endblock %}
{% block main %}
<div class="docs">
  <nav class="doc-list">
    {% for f, title in nav %}<a href="/docs?name={{ f }}" class="{{ 'on' if f == doc }}">{{ title }}</a>{% endfor %}
  </nav>
  <article>
    {% if path %}<div class="doc-head"><span class="muted small">File: <a href="/docs/raw?name={{ doc }}"><code>{{ path }}</code></a></span>
      <button type="button" id="gp-as-panel" class="btn" data-doc="{{ doc }}"
        data-fallback="{{ '/uc/' ~ nav_uc ~ '/evals' if nav_uc else '/' }}">📖 Open as side panel</button></div>{% endif %}
    <div class="doc">{{ html }}</div>
  </article>
</div>
{% endblock %}
