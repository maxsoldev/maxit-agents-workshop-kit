<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kit{% endblock %} · MaxIT agent kit</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">MaxIT agent kit</a>
  <nav class="ucs">
    {% for u in usecases %}<a href="/uc/{{ u }}/cases" class="{{ 'on' if u == uc }}">{{ u }}</a>{% endfor %}
  </nav>
  {% if uc %}
  <nav class="pages">
    {% set path = request.url.path %}
    <a href="/uc/{{ uc }}/cases" class="{{ 'on' if '/cases' in path }}">Cases</a>
    <a href="/uc/{{ uc }}/run" class="{{ 'on' if path.endswith('/run') }}">Run</a>
    <a href="/uc/{{ uc }}/runs" class="{{ 'on' if '/runs' in path }}">Runs</a>
  </nav>
  {% endif %}
  <nav class="ext">
    <a href="{{ settings.n8n_url }}" target="_blank">n8n ↗</a>
    {% if langfuse_link %}<a href="{{ settings.langfuse_host }}" target="_blank">Langfuse ↗</a>{% endif %}
    <a href="/docs">Docs</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
