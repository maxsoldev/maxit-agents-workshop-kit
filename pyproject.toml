[project]
name = "maxit-agents-workshop-kit"
version = "0.1.0"
description = "MaxIT agents workshop kit: build an agent with eval-driven development"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "mcp>=1.9",
  "openai>=1.60",
  "langfuse>=5.2,<6",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
  "markdown-it-py>=4.3.0",
]

[project.scripts]
kit = "kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["usecases/*/data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["live: calls a real outside service (run with -m live)"]
addopts = "-m 'not live'"
